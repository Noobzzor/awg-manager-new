name: awgm-personal-trial
services:
  gateway:
    image: awgm-personal-trial:20261021-dns1
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      AWG_GATEWAY_PUBLIC_ENDPOINT: ${AWG_GATEWAY_PUBLIC_ENDPOINT:?Set the VPS address and UDP port}
    ports:
      - "127.0.0.1:${AWG_HTTP_PORT:-2222}:2222"
      - "${AWG_UDP_BIND:-0.0.0.0}:${AWG_UDP_PORT:-51820}:51820/udp"
    volumes:
      - trial-data:/data
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0750
      - /tmp:size=128m,mode=1777
    pids_limit: 128
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1
    logging:
      driver: local
      options:
        max-size: 4m
        max-file: "1"
        compress: "false"
volumes:
  trial-data:
