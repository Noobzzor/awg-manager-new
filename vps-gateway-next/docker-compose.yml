services:
  awg-manager:
    image: awg-manager:${AWG_VERSION:-2.19.0}
    build:
      context: .
      args:
        AWG_VERSION: ${AWG_VERSION:-2.19.0}
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      AWG_MODE: singbox
      AWG_GATEWAY_ENABLE: ${AWG_GATEWAY_ENABLE:-false}
      AWG_GATEWAY_INTERFACE: ${AWG_GATEWAY_INTERFACE:-awg0}
      AWG_GATEWAY_TOOL: ${AWG_GATEWAY_TOOL:-/usr/bin/wg}
      AWG_GATEWAY_WAN_INTERFACE: ${AWG_GATEWAY_WAN_INTERFACE:-}
      AWG_GATEWAY_PORT: ${AWG_GATEWAY_PORT:-51820}
      AWG_GATEWAY_CLIENT_POOL: ${AWG_GATEWAY_CLIENT_POOL:-10.66.0.0/24}
      AWG_GATEWAY_SERVER_ADDRESS: ${AWG_GATEWAY_SERVER_ADDRESS:-10.66.0.1/24}
      AWG_GATEWAY_PUBLIC_ENDPOINT: ${AWG_GATEWAY_PUBLIC_ENDPOINT:-}
      AWG_GATEWAY_SUBSCRIPTION_BASE_URL: ${AWG_GATEWAY_SUBSCRIPTION_BASE_URL:-}
      AWG_DATA_DIR: /data
      AWG_HTTP_ADDR: 0.0.0.0:2222
      SINGBOX_BIN: /usr/local/bin/sing-box
      SINGBOX_CONFIG_DIR: /data/sing-box/config.d
      AWG_DNS_UPSTREAM: ${AWG_DNS_UPSTREAM:-1.1.1.1}
      AWG_PROXY_ADDR: 0.0.0.0:1080
    ports:
      - "127.0.0.1:${AWG_HTTP_PORT:-2222}:2222"
      - "127.0.0.1:${AWG_PROXY_PORT:-1080}:1080"
      - "${AWG_GATEWAY_BIND:-127.0.0.1}:${AWG_GATEWAY_PORT:-51820}:51820/udp"
    volumes:
      - awg-data:/data
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0750,uid=10001,gid=10001
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:2222/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  awg-data:
